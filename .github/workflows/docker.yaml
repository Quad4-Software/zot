name: docker

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  GOEXPERIMENT: jsonv2
  IMAGE_NAME: ghcr.io/quad4-software/zot

jobs:
  binaries:
    name: build linux-${{ matrix.arch }} binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Build UI
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build binary
        env:
          ZUI_BUILD_PATH: ui/build
          ARCH: ${{ matrix.arch }}
        run: make binary OS=linux ARCH="${ARCH}"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zot-linux-${{ matrix.arch }}
          path: bin/zot-linux-${{ matrix.arch }}
          if-no-files-found: error

  image:
    name: image
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read # checkout and artifact download
      packages: write # push image to GHCR
      id-token: write # OIDC token for keyless cosign signing
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zot-linux-*
          path: bin
          merge-multiple: true

      - name: Setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=quad4-zot
            org.opencontainers.image.description=Quad4's OCI registry, a zot fork
            org.opencontainers.image.vendor=Quad4
            org.opencontainers.image.url=https://quad4.io
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          COSIGN_YES: "true"
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          fail-build: false
          output-format: json
          output-file: grype.json

      - name: Attest OpenVEX
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq \
            --arg id "https://quad4.io/vex/zot/${GITHUB_SHA}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg purl "pkg:oci/zot@${IMAGE_DIGEST}?repository_url=${IMAGE_NAME}" \
            '.["@id"] = $id | .timestamp = $ts | .version = 1 | .products = [$purl]' \
            build/openvex.json > openvex.json

          # findings not covered by an authored statement are recorded as
          # under_investigation; triage them in build/openvex.json
          jq -n \
            --slurpfile vex openvex.json \
            --slurpfile grype grype.json \
            --arg purl "pkg:oci/zot@${IMAGE_DIGEST}?repository_url=${IMAGE_NAME}" \
            '($vex[0].statements // []) as $authored |
             ($authored | map(.vulnerability.name // .vulnerability["@id"] // .vulnerability)) as $known |
             (($grype[0].matches // []) | map(.vulnerability.id) | unique |
               map(select(. as $v | ($known | index($v)) == null) |
                 {vulnerability: {name: .}, products: [$purl], status: "under_investigation"})) as $auto |
             $vex[0] | .statements = ($authored + $auto)' \
            > openvex.merged.json && mv openvex.merged.json openvex.json

          cosign attest --yes --predicate openvex.json --type openvex "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Upload SBOM and VEX artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            sbom.spdx.json
            openvex.json
          if-no-files-found: error
