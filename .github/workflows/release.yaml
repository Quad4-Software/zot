name: release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GOEXPERIMENT: jsonv2

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Build UI
        working-directory: ui
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable pnpm
          corepack install
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build binaries
        env:
          ZUI_BUILD_PATH: ui/build
          TARGET: ${{ matrix.target }}
        run: make binary binary-minimal OS="${TARGET%-*}" ARCH="${TARGET#*-}"

      - name: Package artifacts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          goos="${TARGET%-*}"
          goarch="${TARGET#*-}"
          mkdir -p dist
          cp "bin/zot-${goos}-${goarch}" "bin/zot-${goos}-${goarch}-minimal" dist/
          cd dist
          sha256sum * > "zot-${TARGET}-sha256sums.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zot-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: zot-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes dist/*
